<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0612"/>
      <stop offset="0.6" stop-color="#140a22"/>
      <stop offset="1" stop-color="#1c0d1f"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="fireV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2a1d44"/>
    </pattern>
    <radialGradient id="glowR" cx="0.8" cy="0.45" r="0.42">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.08" cy="0.2" r="0.4">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="chartClip"><rect x="30" y="52" width="480" height="160"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .lbl  { fill: #9a8cc0; font-size: 11px; letter-spacing: 1.6px; }
      .tiny { fill: #6f628f; font-size: 10px; letter-spacing: 1px; }
      .scan { animation: scan 5s linear infinite; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 1.8s ease-out infinite; }
      .draw { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 4.5s ease-out infinite; }
      .flick { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.6s ease-in-out infinite; }
      @keyframes scan  { from { transform: translateX(0); } to { transform: translateX(480px); } }
      @keyframes ring  { from { transform: scale(0.4); opacity: 0.9; } to { transform: scale(2.6); opacity: 0; } }
      @keyframes draw  { 0% { stroke-dashoffset: 700; } 55%,100% { stroke-dashoffset: 0; } }
      @keyframes flick { 50% { transform: scaleY(1.12) scaleX(0.94); } }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#dots)"/>
  <rect width="1200" height="360" fill="url(#glowL)"/>
  <rect width="1200" height="360" fill="url(#glowR)"/>

  <!-- Left: identity -->
  <g class="mono">
    <!-- shield + flame -->
    <g transform="translate(96,84)">
      <path d="M0 -34 L28 -23 V6 C28 24 13 35 0 42 C-13 35 -28 24 -28 6 V-23 Z"
            fill="#1a1030" stroke="url(#fireV)" stroke-width="2.5"/>
      <path class="flick" d="M0 -17 C7 -8 13 -1 11 10 C9 19 -9 19 -11 10 C-13 1 -5 -2 0 -17 Z" fill="url(#fireV)"/>
      <path d="M0 -2 C3 3 6 6 5 11 C4 15 -4 15 -5 11 C-6 6 -2 4 0 -2 Z" fill="#0a0612" opacity="0.55"/>
    </g>
    <text x="142" y="78" fill="#fb923c" font-size="13" letter-spacing="3.5">RULE DRIFT · DETECTION</text>
    <text x="142" y="98" fill="#6f628f" font-size="11" letter-spacing="1.5">/ machine-learning · firewall policy</text>

    <text x="60" y="190" fill="#faf7ff" font-size="70" font-weight="700" letter-spacing="-2">Firewall<tspan fill="url(#fire)">ML</tspan></text>
    <text x="64" y="232" fill="#b3a8d4" font-size="19">Learn the baseline. Score every change.</text>
    <text x="64" y="258" fill="#b3a8d4" font-size="19">Catch rule drift before it bites.</text>

    <!-- pipeline chips -->
    <g font-size="11" letter-spacing="1.5">
      <rect x="64" y="288" width="104" height="28" rx="14" fill="none" stroke="#3b2d63"/>
      <text x="116" y="306" fill="#a78bfa" text-anchor="middle">BASELINE</text>
      <text x="182" y="306" fill="#6f628f">→</text>
      <rect x="202" y="288" width="84" height="28" rx="14" fill="none" stroke="#3b2d63"/>
      <text x="244" y="306" fill="#fbbf24" text-anchor="middle">SCORE</text>
      <text x="300" y="306" fill="#6f628f">→</text>
      <rect x="320" y="288" width="84" height="28" rx="14" fill="#2a0f1c" stroke="#f43f5e"/>
      <text x="362" y="306" fill="#fb7185" text-anchor="middle">ALERT</text>
    </g>
  </g>

  <!-- Right: drift chart panel -->
  <g class="mono" transform="translate(620,46)">
    <rect x="0" y="0" width="540" height="268" rx="14" fill="#0d0819" fill-opacity="0.8" stroke="#2f2252" stroke-width="1.5"/>
    <text class="lbl" x="30" y="32">DRIFT SCORE</text>
    <text class="tiny" x="510" y="32" text-anchor="end">time →</text>

    <!-- safe zone + threshold -->
    <rect x="30" y="95" width="480" height="117" fill="#22d3ee" opacity="0.045"/>
    <line x1="30" y1="95" x2="510" y2="95" stroke="#f43f5e" stroke-width="1.3" stroke-dasharray="5 5"/>
    <text x="34" y="89" fill="#f43f5e" font-size="11">τ threshold</text>
    <text class="tiny" x="34" y="206">stable zone</text>

    <!-- grid ticks -->
    <g stroke="#241a40" stroke-width="1">
      <line x1="30" y1="132" x2="510" y2="132"/>
      <line x1="30" y1="170" x2="510" y2="170"/>
      <line x1="30" y1="212" x2="510" y2="212" stroke="#33265a"/>
    </g>

    <g clip-path="url(#chartClip)">
      <!-- baseline -->
      <path d="M30 170 C80 165,120 175,170 168 S260 172,320 166 S420 170,510 168"
            fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round" opacity="0.8"/>
      <!-- observed -->
      <path class="draw" d="M30 172 C80 160,120 178,170 164 S250 175,300 160 C340 140,370 90,400 70 S460 55,510 50"
            fill="none" stroke="url(#fire)" stroke-width="3.2" stroke-linecap="round"/>
      <!-- scan line -->
      <g class="scan"><rect x="30" y="52" width="2" height="160" fill="#a78bfa" opacity="0.35"/></g>
    </g>

    <!-- flagged point -->
    <circle class="ring" cx="373" cy="94" r="9" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="373" cy="94" r="5.5" fill="#f43f5e"/>
    <circle cx="373" cy="94" r="2" fill="#fff"/>

    <!-- callout -->
    <line x1="377" y1="100" x2="404" y2="124" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="404" y="116" width="106" height="44" rx="8" fill="#2a0f1c" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="414" y="134" fill="#fda4af" font-size="11" letter-spacing="1">RULE #103</text>
    <text x="414" y="151" fill="#faf7ff" font-size="12">0.93 &gt; τ  ⚠</text>

    <!-- legend -->
    <g font-size="11">
      <line x1="30" y1="240" x2="52" y2="240" stroke="#22d3ee" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
      <text x="60" y="244" fill="#9a8cc0">baseline</text>
      <line x1="140" y1="240" x2="162" y2="240" stroke="url(#fire)" stroke-width="3" stroke-linecap="round"/>
      <text x="170" y="244" fill="#9a8cc0">observed ruleset</text>
      <text x="510" y="244" fill="#6f628f" text-anchor="end">drift = f_ML(rule, baseline)</text>
    </g>
  </g>

  <rect x="0" y="356" width="1200" height="4" fill="url(#fire)"/>
</svg>
